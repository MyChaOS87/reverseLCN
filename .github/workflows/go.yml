name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.27'

    - name: Tidy check (gate, no changes)
      run: make tidy-check

    - name: Add license notice (gate, no changes)
      run: |
        make notice
        git diff --exit-code

    - name: SBOM check (gate, no changes)
      run: make sbom-check

    - name: Build
      run: make build

    - name: Lint
      run: make lint

    - name: Test with Coverage
      run: make coverage

    - name: Build Docker image
      run: make docker-build
