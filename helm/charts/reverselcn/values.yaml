# Default values for reverselcn.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/mychaos87/reverselcn
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  supplementalGroups:
    - 20

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serialDevice:
  enabled: true
  hostPath: /dev/lcn-pku
  mountPath: /dev/lcn-pku
  type: CharDevice

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi

env: []

nodeSelector: {}

tolerations: []

affinity: {}
