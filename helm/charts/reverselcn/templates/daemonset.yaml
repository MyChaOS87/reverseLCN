apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "reverselcn.fullname" . }}
  labels:
    {{- include "reverselcn.labels" . | nindent 4 }}
spec:
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reverselcn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "reverselcn.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "reverselcn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $hasSerialPort := false }}
          {{- range .Values.env }}
          {{- if eq .name "LCN_SERIAL_PORT" }}
          {{- $hasSerialPort = true }}
          {{- end }}
          {{- end }}
          {{- $injectSerialPort := and .Values.serialDevice.enabled (not $hasSerialPort) }}
          {{- if or $injectSerialPort .Values.env }}
          env:
            {{- if $injectSerialPort }}
            - name: LCN_SERIAL_PORT
              value: {{ .Values.serialDevice.mountPath | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.serialDevice.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.serialDevice.enabled }}
            - name: serial-device
              mountPath: {{ .Values.serialDevice.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.serialDevice.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.serialDevice.enabled }}
        - name: serial-device
          hostPath:
            path: {{ .Values.serialDevice.hostPath }}
            type: {{ .Values.serialDevice.type | default "CharDevice" }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
